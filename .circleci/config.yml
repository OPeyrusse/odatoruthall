version: 2.1

# The Clojure toolchain the workspace is built and tested with. Java 26: the
# collection cycle and the day scan run on virtual threads, and the image runs
# the same version. Medium (2 vCPU, 4 GB): the uberjar compile peaks under
# 3 cores and 500 MB, so the org default (large) is mostly idle.
executors:
  clojure:
    docker:
      - image: clojure:temurin-26-tools-deps
    resource_class: medium
    working_directory: ~/odatoruthall

commands:
  # Every brick has its own deps.edn, so the cache key covers all of them, not
  # only the root one.
  restore-deps:
    steps:
      - run:
          name: Fingerprint every deps.edn
          command: find . -name deps.edn -not -path './.git/*' | sort | xargs cat > /tmp/deps-fingerprint
      - restore_cache:
          keys:
            - deps-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "/tmp/deps-fingerprint" }}
            - deps-v2-{{ .Environment.CIRCLE_JOB }}-
  save-deps:
    steps:
      - save_cache:
          key: deps-v2-{{ .Environment.CIRCLE_JOB }}-{{ checksum "/tmp/deps-fingerprint" }}
          paths:
            - ~/.m2
            - ~/.gitlibs

jobs:
  # Behavioural specification: structural check plus process analysis.
  # The spec is the primary artefact, so it is gated like the code. The
  # checker is pinned and cached as a binary — building it from source
  # takes longer than running it.
  spec-check:
    docker:
      - image: cimg/rust:1.94
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - allium-cli-v1-3.6.1
      - run:
          name: Install the Allium checker
          command: command -v allium || cargo install allium-cli --version 3.6.1
      - save_cache:
          key: allium-cli-v1-3.6.1
          paths:
            - ~/.cargo/bin/allium
      - run:
          name: Check the specs (errors and process findings are fatal)
          command: ./scripts/check-specs.sh

  # Every brick's tests. They run against the mock GitHub and the mock Jira,
  # so nothing here reaches a network or needs a credential.
  test:
    executor: clojure
    steps:
      - checkout
      - restore-deps
      - run:
          name: Resolve the workspace dependencies
          command: clojure -P -M:dev:test
      - save-deps
      - run:
          name: Run every brick's tests
          command: clojure -M:dev:test
          environment:
            ODATO_TEST_REPORT: test-results/clojure/results.xml
      - store_test_results:
          path: test-results

  # The front-end assets are committed so that the jar and the image build
  # without Node. This rebuilds them from the views and fails when the
  # committed ones are stale: run `npm run assets` and commit the result.
  assets:
    docker:
      - image: cimg/node:22.22
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install the asset toolchain
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Rebuild the stylesheet and the Datastar bundle
          command: npm run assets
      - run:
          name: The committed assets match the views
          command: git diff --exit-code --stat -- bases/server/resources/public

  # The artefact: the uberjar the image runs, started once to show it serves
  # both applications.
  build:
    executor: clojure
    steps:
      - checkout
      - restore-deps
      - run:
          name: Build the uberjar
          command: ./scripts/build-jar.sh
      - save-deps
      - run:
          name: The jar starts and serves both applications
          command: ./scripts/smoke-jar.sh
      - store_artifacts:
          path: projects/server/target/odatoruthall.jar
          destination: odatoruthall.jar

workflows:
  ci:
    jobs:
      # PR-only: the gate runs on every branch except main.
      - spec-check:
          filters:
            branches:
              ignore: main
      - test:
          filters:
            branches:
              ignore: main
      - assets:
          filters:
            branches:
              ignore: main
      - build:
          requires:
            - test
            - assets
          filters:
            branches:
              ignore: main
  continuous-release:
    jobs:
      - build:
          name: release-build
          filters:
            branches:
              only: main
