version: 2.1

# The Clojure toolchain the workspace is built and tested with. Java 26: the
# collection cycle and the day scan run on virtual threads, and the image runs
# the same version.
executors:
  clojure:
    docker:
      - image: clojure:temurin-26-tools-deps
    working_directory: ~/odatoruthall

jobs:
  # Behavioural specification: structural check plus process analysis.
  # The spec is the primary artefact, so it is gated like the code. The
  # checker is pinned and cached as a binary — building it from source
  # takes longer than running it.
  spec-check:
    docker:
      - image: cimg/rust:1.94
    steps:
      - checkout
      - restore_cache:
          keys:
            - allium-cli-v1-3.6.1
      - run:
          name: Install the Allium checker
          command: command -v allium || cargo install allium-cli --version 3.6.1
      - save_cache:
          key: allium-cli-v1-3.6.1
          paths:
            - ~/.cargo/bin/allium
      - run:
          name: Check the specs (errors and process findings are fatal)
          command: ./scripts/check-specs.sh

  # Every brick's tests. They run against the mock GitHub and the mock Jira,
  # so nothing here reaches a network or needs a credential.
  test:
    executor: clojure
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "deps.edn" }}
            - deps-v1-
      - run:
          name: Resolve the workspace dependencies
          command: clojure -P -M:dev:test
      - save_cache:
          key: deps-v1-{{ checksum "deps.edn" }}
          paths:
            - ~/.m2
            - .cpcache
      - run:
          name: Run every brick's tests
          command: clojure -M:dev:test

  # The artefact: the uberjar the image runs. The front-end assets are
  # committed, so this job checks that they are in step with the views rather
  # than rebuilding them blindly.
  build:
    executor: clojure
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "deps.edn" }}
            - deps-v1-
      - run:
          name: Build the uberjar
          command: ./scripts/build-jar.sh
      - run:
          name: The jar starts and serves both applications
          command: ./scripts/smoke-jar.sh
      - store_artifacts:
          path: projects/server/target/odatoruthall.jar
          destination: odatoruthall.jar

workflows:
  ci:
    jobs:
      # PR-only: the gate runs on every branch except main.
      - spec-check:
          filters:
            branches:
              ignore: main
      - test
      - build:
          requires:
            - test
